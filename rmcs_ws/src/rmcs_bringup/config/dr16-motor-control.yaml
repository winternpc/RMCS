rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::Dr16MotorControl -> dr16_motor_control

dr16_motor_control:
  ros__parameters:
    board_serial: ""

    max_target_velocity: 10.0

    velocity_filter_cutoff_hz: 10.0

    velocity_kp: 0.05
    velocity_ki: 0.0
    velocity_kd: 0.0

    velocity_integral_min: -100.0
    velocity_integral_max: 100.0

    velocity_integral_split_min: -10.0
    velocity_integral_split_max: 10.0

    # 第一次真实驱动先限制得小一点。
    velocity_output_min: -0.2
    velocity_output_max: 0.2